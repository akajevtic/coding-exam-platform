openapi: 3.1.0
info:
  title: RAF LMS API
  version: 0.1.0
  description: >-
    Početni ugovor za paralelan rad klijenta i servera. Nacrt je ograničen na MVP
    i treba ga zajednički potvrditi pre implementacije. Sve vreme je ISO-8601 sa zonom.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Prijava i izdavanje access tokena
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: Uspešna prijava
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /subjects:
    get:
      summary: Predmeti (svi prijavljeni)
      responses:
        '200':
          description: Lista predmeta
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Subject' } } } }
  /teacher/subjects:
    post:
      summary: Nastavnik dodaje predmet
      x-required-role: NASTAVNIK
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubjectInput' } } }
      responses:
        '201': { description: Predmet kreiran, content: { application/json: { schema: { $ref: '#/components/schemas/Subject' } } } }
        '409': { description: Šifra već postoji }
  /exam-periods:
    get:
      summary: Ispitni rokovi (svi prijavljeni), najnoviji prvi
      responses:
        '200':
          description: Lista rokova
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ExamPeriod' } } } }
  /teacher/exam-periods:
    post:
      summary: Nastavnik dodaje ispitni rok
      x-required-role: NASTAVNIK
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ExamPeriodInput' } } }
      responses:
        '201': { description: Rok kreiran, content: { application/json: { schema: { $ref: '#/components/schemas/ExamPeriod' } } } }
        '409': { description: Rok sa istim nazivom i godinom već postoji }
  /teacher/terms:
    post:
      summary: Nastavnik kreira termin (predmet, rok, vreme, učionica)
      x-required-role: NASTAVNIK
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TermInput' } } }
      responses:
        '201': { description: Termin kreiran, content: { application/json: { schema: { $ref: '#/components/schemas/Term' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: Svi termini sa grupama/polaganjima, najnoviji prvi
      x-required-role: NASTAVNIK
      responses:
        '200':
          description: Lista termina
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Term' } } } }
  /teacher/terms/{termId}/groups:
    post:
      summary: Kreira grupu u terminu i njen zadatak (polaganje)
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/TermId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GroupInput' } } }
      responses:
        '201': { description: Polaganje kreirano, content: { application/json: { schema: { $ref: '#/components/schemas/Exam' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Grupa sa tim nazivom već postoji u terminu }
  /teacher/terms/{termId}/roster:
    put:
      summary: >-
        Postavlja spisak prijavljenih za predmet i rok termina; zamenjuje prethodni spisak.
        Nepoznati studenti se upisuju (bez naloga). Indeks se normalizuje ("rn  1/2023" -> "RN 1/2023").
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/TermId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [students]
              properties:
                students:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/StudentIdentity' }
      responses:
        '200':
          description: Spisak je sačuvan
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered: { type: integer, description: broj studenata na spisku }
                  newStudents: { type: integer, description: koliko je tek upisano u bazu }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /teacher/exams/{examId}/task:
    put:
      summary: Postavlja ZIP projektnog zadatka (zamenjuje prethodni), najviše 50 MB
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/ExamId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '204': { description: Zadatak je postavljen }
        '400': { description: Prazan fajl ili nije ZIP }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Fajl je veći od 50 MB }
  /auth/change-password:
    post:
      summary: Promena lozinke prijavljenog korisnika
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '204': { description: Lozinka promenjena }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /student/me:
    get:
      summary: Podaci prijavljenog studenta (automatsko popunjavanje prijave)
      x-required-role: STUDENT
      responses:
        '200': { description: Student, content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }
  /student/terms:
    get:
      summary: Termini koji nisu zavrseni, za predmet i rok na koje je student prijavljen, sa grupama
      x-required-role: STUDENT
      responses:
        '200':
          description: Lista termina
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Term' } } } }
  /student/attempts:
    post:
      summary: >-
        Prijava na polaganje: proverava indeks (mora biti indeks naloga), spisak prijavljenih i da je termin u toku
        (serverski sat). Pravi rad i belezi vreme preuzimanja; ponovna prijava vraca isti rad.
      x-required-role: STUDENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termId, group, studentNumber]
              properties:
                termId: { type: integer, format: int64 }
                group: { type: string }
                studentNumber: { type: string }
      responses:
        '201': { description: Rad zapocet, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '403': { description: 'Nije na spisku, tudji indeks, termin nije poceo ili je zavrsen' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Zadatak nije postavljen ili student vec polaze u drugoj grupi }
    get:
      summary: Svi radovi prijavljenog studenta
      x-required-role: STUDENT
      responses:
        '200': { description: Lista radova, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Attempt' } } } } }
  /student/attempts/{attemptId}:
    get:
      summary: Jedan rad studenta (tudji rad vraca 404)
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses:
        '200': { description: Rad, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /student/attempts/{attemptId}/task:
    get:
      summary: ZIP zadatka, samo tokom termina
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses:
        '200': { description: ZIP, content: { application/zip: { schema: { type: string, format: binary } } } }
        '403': { description: Van termina }
        '404': { $ref: '#/components/responses/NotFound' }
  /student/attempts/{attemptId}/submission:
    post:
      summary: >-
        Predaja ZIP-a do kraja termina; nova predaja zamenjuje prethodnu.
        final=false je automatsko slanje: fajl se cuva, rad ostaje U_IZRADI.
      x-required-role: STUDENT
      parameters:
        - { $ref: '#/components/parameters/AttemptId' }
        - { name: final, in: query, schema: { type: boolean, default: true } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200': { description: Sacuvano, content: { application/json: { schema: { $ref: '#/components/schemas/Attempt' } } } }
        '400': { description: Prazan fajl ili nije ZIP }
        '403': { description: Rok za predaju je istekao }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: Poslednje sacuvano resenje (nastavak rada na drugom racunaru, pregled posle termina)
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses:
        '200': { description: ZIP, content: { application/zip: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /student/attempts/{attemptId}/feedback:
    get:
      summary: Poeni i komentari nastavnika za sopstveni rad
      x-required-role: STUDENT
      parameters: [{ $ref: '#/components/parameters/AttemptId' }]
      responses:
        '200': { description: Povratna informacija, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /teacher/submissions:
    get:
      summary: Radovi po kriterijumima selekcije (svi opcioni)
      x-required-role: NASTAVNIK
      parameters: &kriterijumi
        - { name: subjectId, in: query, schema: { type: integer, format: int64 } }
        - { name: examPeriodId, in: query, schema: { type: integer, format: int64 } }
        - { name: termId, in: query, schema: { type: integer, format: int64 } }
        - { name: groupId, in: query, schema: { type: integer, format: int64 } }
        - { name: room, in: query, schema: { type: string } }
        - { name: studentNumber, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [U_IZRADI, PREDATO] } }
      responses:
        '200': { description: Lista radova, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Submission' } } } } }
  /teacher/submissions/download:
    get:
      summary: Jedan ZIP sa resenjima izabranih radova (predmet/grupa/indeks.zip)
      x-required-role: NASTAVNIK
      parameters: *kriterijumi
      responses:
        '200': { description: ZIP, content: { application/zip: { schema: { type: string, format: binary } } } }
  /teacher/submissions/{submissionId}:
    get:
      summary: Jedan rad
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      responses:
        '200': { description: Rad, content: { application/json: { schema: { $ref: '#/components/schemas/Submission' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /teacher/submissions/{submissionId}/file:
    get:
      summary: ZIP resenja jednog rada
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      responses:
        '200': { description: ZIP, content: { application/zip: { schema: { type: string, format: binary } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /teacher/submissions/{submissionId}/grade:
    get:
      summary: Trenutni poeni i komentari
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      responses:
        '200': { description: Ocena, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
    put:
      summary: Upis poena i komentara (komentari zamenjuju prethodne)
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/SubmissionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/GradeInput' } } }
      responses:
        '200': { description: Ocena sacuvana, content: { application/json: { schema: { $ref: '#/components/schemas/Feedback' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Rad nema predato resenje }
  /teacher/terms/{termId}/monitoring:
    get:
      summary: Preuzeti i predati radovi, prosecno vreme izrade i status svakog studenta u terminu
      x-required-role: NASTAVNIK
      parameters: [{ $ref: '#/components/parameters/TermId' }]
      responses:
        '200': { description: Monitoring, content: { application/json: { schema: { $ref: '#/components/schemas/Monitoring' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ExamId:
      name: examId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    TermId:
      name: termId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  schemas:
    LoginResponse:
      type: object
      required: [accessToken, userId, role]
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        userId: { type: integer, format: int64 }
        role: { type: string, enum: [STUDENT, NASTAVNIK] }
    Subject:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        name: { type: string }
    SubjectInput:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    ExamPeriod:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        schoolYear: { type: string, example: 2026/2027 }
    ExamPeriodInput:
      type: object
      required: [name, schoolYear]
      properties:
        name: { type: string }
        schoolYear: { type: string }
    TermInput:
      type: object
      required: [subjectId, examPeriodId, startsAt, endsAt]
      properties:
        subjectId: { type: integer, format: int64 }
        examPeriodId: { type: integer, format: int64 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: mora biti posle startsAt }
        room: { type: string }
    Term:
      type: object
      properties:
        id: { type: integer, format: int64 }
        subject: { $ref: '#/components/schemas/Subject' }
        examPeriod: { $ref: '#/components/schemas/ExamPeriod' }
        startsAt: { type: string, format: date-time, description: uvek u UTC (Z) }
        endsAt: { type: string, format: date-time }
        room: { type: string }
        exams: { type: array, items: { $ref: '#/components/schemas/Exam' } }
    GroupInput:
      type: object
      required: [group, title]
      properties:
        group: { type: string }
        title: { type: string }
        description: { type: string }
    Exam:
      type: object
      description: Polaganje = zadatak jedne grupe u terminu; id je id zadatka.
      properties:
        id: { type: integer, format: int64 }
        termId: { type: integer, format: int64 }
        groupId: { type: integer, format: int64 }
        group: { type: string }
        title: { type: string }
        description: { type: string }
        hasTask: { type: boolean, description: da li je ZIP učitan }
    StudentIdentity:
      type: object
      required: [studentNumber, firstName, lastName, email]
      properties:
        studentNumber: { type: string, example: RN 12/2023 }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
    Student:
      type: object
      properties:
        id: { type: integer, format: int64 }
        studentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
    Attempt:
      type: object
      description: Rad studenta; serverTime sluzi za tajmer po serverskom satu.
      properties:
        id: { type: integer, format: int64 }
        examId: { type: integer, format: int64 }
        termId: { type: integer, format: int64 }
        subject: { type: string }
        group: { type: string }
        title: { type: string }
        status: { type: string, enum: [U_IZRADI, PREDATO] }
        downloadedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        serverTime: { type: string, format: date-time }
        hasSavedWork: { type: boolean }
    Submission:
      type: object
      properties:
        id: { type: integer, format: int64 }
        examId: { type: integer, format: int64 }
        termId: { type: integer, format: int64 }
        subject: { type: string }
        examPeriod: { type: string }
        group: { type: string }
        room: { type: string }
        studentNumber: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        status: { type: string, enum: [U_IZRADI, PREDATO] }
        downloadedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time }
        durationSeconds: { type: integer }
        score: { type: number }
        hasFile: { type: boolean }
    Comment:
      type: object
      required: [filePath, line, text]
      properties:
        id: { type: integer, format: int64 }
        filePath: { type: string }
        line: { type: integer, minimum: 1 }
        text: { type: string }
    Feedback:
      type: object
      properties:
        attemptId: { type: integer, format: int64 }
        score: { type: number, nullable: true }
        comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    GradeInput:
      type: object
      required: [score, comments]
      properties:
        score: { type: number, minimum: 0 }
        comments: { type: array, items: { $ref: '#/components/schemas/Comment' } }
    Monitoring:
      type: object
      properties:
        termId: { type: integer, format: int64 }
        serverTime: { type: string, format: date-time }
        registeredCount: { type: integer }
        downloadedCount: { type: integer }
        submittedCount: { type: integer }
        averageDurationSeconds: { type: number, nullable: true }
        students:
          type: array
          items:
            type: object
            properties:
              studentNumber: { type: string }
              firstName: { type: string }
              lastName: { type: string }
              group: { type: string, nullable: true }
              status: { type: string, enum: [NIJE_ZAPOCETO, U_IZRADI, PREDATO] }
              downloadedAt: { type: string, format: date-time }
              submittedAt: { type: string, format: date-time }
              durationSeconds: { type: integer }
    Error:
      type: object
      description: RFC 9457 ProblemDetail (Spring); detail je poruka za korisnika.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors: { type: object, additionalProperties: { type: string }, description: greske validacije po polju }
  responses:
    BadRequest:
      description: Neispravan zahtev
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Nedostaje ili nije ispravan token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Korisnik nema pravo na ovu operaciju
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resurs nije pronađen
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Radnja nije dozvoljena za trenutno stanje/termin
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
