# Testovi rade nad H2 bazom u memoriji (ne diraju lokalni MySQL)
spring.datasource.url=jdbc:h2:mem:raflms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# test fajl zamenjuje glavni application.properties, pa i ove vrednosti moraju ovde
app.security.jwt-secret=test-tajni-kljuc-za-raf-lms-0123456789abcdef
app.security.jwt-trajanje=1h
app.security.cors-origins=http://localhost:*
# pocetna lozinka naloga koje pravi unos spiska prijavljenih (student je menja posle prve prijave)
app.student.pocetna-lozinka=student123
app.seed.lozinka=lozinka123

# ===============================
# Fajlovi (ZIP zadataka i predaja)
# ===============================
# folder na serverskom disku, van javnog direktorijuma
app.storage.dir=target/test-storage
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
