# ===============================
# App
# ===============================
spring.application.name=raf-lms-api
server.port=8080
# sve rute su pod /api/v1, kao u docs/api-contract.yaml
server.servlet.context-path=/api/v1

# Keep SQL noise down (flip to true while debugging)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.tool.schema=OFF

# Safer default: don't keep the session open across view rendering
spring.jpa.open-in-view=false

# ===============================
# MySQL
# Kredencijali se mogu zadati kroz env promenljive ili .env fajl (spring-dotenv),
# u suprotnom vaze podrazumevane vrednosti posle ':'
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raflms?createDatabaseIfNotExist=true&useSSL=true&requireSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# update cuva podatke izmedju pokretanja; Seeder puni bazu samo kad je prazna
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
# Instant polja se u bazi cuvaju u UTC, nezavisno od zone servera
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Bezbednost (JWT)
# U produkciji OBAVEZNO zadati JWT_SECRET (najmanje 32 karaktera), podrazumevani kljuc je samo za razvoj
# ===============================
app.security.jwt-secret=${JWT_SECRET:dev-tajni-kljuc-za-raf-lms-samo-lokalno-0123456789}
app.security.jwt-trajanje=${JWT_TRAJANJE:8h}
app.security.cors-origins=${CORS_ORIGINS:http://localhost:*}
# lozinka za naloge koje pravi Seeder (svi seedovani studenti i nastavnici)
# pocetna lozinka naloga koje pravi unos spiska prijavljenih (student je menja posle prve prijave)
app.student.pocetna-lozinka=${STUDENT_POCETNA_LOZINKA:student123}
app.seed.lozinka=${SEED_LOZINKA:lozinka123}

# ===============================
# Fajlovi (ZIP zadataka i predaja)
# ===============================
# folder na serverskom disku, van javnog direktorijuma
app.storage.dir=${STORAGE_DIR:./storage}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Lokalni rad: uz API se pokrecu i editor i monitoring (config/KlijentiPokretac)
# ===============================
app.dev.pokreni-klijente=${POKRENI_KLIJENTE:true}
